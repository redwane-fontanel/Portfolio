<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Unisync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="signup.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
          <a class="navbar-brand" href="#">Unisync</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
              <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav ms-auto">
                  <li class="nav-item"><a class="nav-link" href="../home/home.html">Home</a></li>
                  <li class="nav-item"><a class="nav-link" href="../budget/budget.html">Budget Calculator</a></li>
                  <li class="nav-item"><a class="nav-link" href="../time/time.html">Time Management</a></li>
                  <li class="nav-item"><a class="nav-link active" href="../study/study.html">Study Planner</a></li>
                  <li class="nav-item"><a class="nav-link active" href="../help/help.html">Help & Support</a></li>
              </ul>
          </div>
      </div>
  </nav>


    <!-- Signup Form -->
    <div class="signup-container">
        <h2 class="text-center">Sign Up</h2>
        <form action="#" method="POST">
            <div class="mb-3">
                <input type="text" class="form-control" name="firstname" placeholder="First Name" required>
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" name="surname" placeholder="Surname" required>
            </div>
            <div class="mb-3">
                <input type="email" class="form-control" name="email" placeholder="Email" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="Password" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" name="confirmPassword" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            <p class="text-center mt-3"><a href="../login/login.html">Already have an account? Login</a></p>
        </form>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
