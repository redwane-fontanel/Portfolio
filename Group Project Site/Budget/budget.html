<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Planner - Unisync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="budget.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        .budget-container {
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
            width: 100%;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
      <!-- Navigation Bar -->
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Unisync</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../home/home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="../budget/budget.html">Budget Calculator</a></li>
                    <li class="nav-item"><a class="nav-link" href="../time/time.html">Time Management</a></li>
                    <li class="nav-item"><a class="nav-link active" href="../study/study.html">Study Planner</a></li>
                    <li class="nav-item"><a class="nav-link active" href="../help/help.html">Help & Support</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <!-- Budget Planner -->
    <div class="budget-container">
        <h1 class="text-center text-primary">Student Budget Planner</h1>
        <form id="budget-form">
            <div class="mb-3">
                <label for="income" class="form-label">Monthly Allowance:</label>
                <input type="number" id="income" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="expense" class="form-label">Expense Description:</label>
                <input type="text" id="expense" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="amount" class="form-label">Amount:</label>
                <input type="number" id="amount" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Expense</button>
        </form>
        <div id="budget-summary" class="card p-4 mt-4">
            <h2 class="text-center text-primary">Budget Summary</h2>
            <p>Total Allowance: <span id="total-income" class="fw-bold">0</span></p>
            <p>Total Expenses: <span id="total-expenses" class="fw-bold">0</span></p>
            <p>Remaining Balance: <span id="remaining-balance" class="fw-bold">0</span></p>
        </div>
        <ul id="expense-list" class="list-group mt-3"></ul>
    </div>

    <!-- Footer -->
    <footer class="footer bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p>&copy; 2025 Unisync | <a href="#" class="text-white">Privacy Policy</a> | <a href="#" class="text-white">Terms & Conditions</a></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="budget.js"></script>
</body>
</html>
